<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RBS Logistica Smart</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            margin: 1rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            max-height: 60px;
            margin-bottom: 1rem;
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--gray-600);
            font-size: 0.875rem;
        }

        .login-form {
            margin-top: 2rem;
        }

        .login-form-group {
            margin-bottom: 1.5rem;
        }

        .login-form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        .login-form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .login-form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .login-btn:hover {
            background: #e85a2a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-error {
            background: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        .login-info {
            margin-top: 2rem;
            padding: 1rem;
            background: var(--gray-100);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--gray-700);
        }

        .login-info strong {
            color: var(--gray-900);
        }

        .user-list {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="logo.svg" alt="RBS 1979" class="login-logo">
            <h1 class="login-title">RBS Logistica Smart</h1>
            <p class="login-subtitle">Sistema di Gestione Viaggi</p>
        </div>

        <div class="login-error" id="loginError"></div>

        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="login-form-group">
                <label for="username">Nome Utente</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Inserisci username">
            </div>

            <div class="login-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Inserisci password">
            </div>

            <button type="submit" class="login-btn">🔐 Accedi</button>
        </form>

        <div class="login-info">
            <strong>ℹ️ Utenti di Default:</strong>
            <div class="user-list">
                <strong>Admin:</strong> admin / admin123<br>
                <strong>Utente:</strong> user / user123
            </div>
        </div>
    </div>

    <script>
        // Default users
        const DEFAULT_USERS = [
            {
                id: 'admin1',
                username: 'admin',
                password: 'admin123',
                role: 'admin',
                name: 'Amministratore'
            },
            {
                id: 'user1',
                username: 'user',
                password: 'user123',
                role: 'user',
                name: 'Utente Standard'
            }
        ];

        // Initialize users if not present
        function initUsers() {
            const stored = localStorage.getItem('rbs_users');
            if (!stored) {
                localStorage.setItem('rbs_users', JSON.stringify(DEFAULT_USERS));
            }
        }

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Get users from localStorage
            const usersJson = localStorage.getItem('rbs_users');
            const users = usersJson ? JSON.parse(usersJson) : DEFAULT_USERS;

            // Find user
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                // Save session
                const session = {
                    userId: user.id,
                    username: user.username,
                    role: user.role,
                    name: user.name,
                    loginTime: new Date().toISOString()
                };
                localStorage.setItem('rbs_session', JSON.stringify(session));

                // Redirect to app
                window.location.href = 'index.html';
            } else {
                showError('Username o password non corretti');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 3000);
        }

        // Initialize on load
        initUsers();

        // Check if already logged in
        const session = localStorage.getItem('rbs_session');
        if (session) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
