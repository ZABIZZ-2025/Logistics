<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Viaggio - RBS Logistica Smart</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .page-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: white;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            color: var(--gray-700);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--gray-100);
            border-color: var(--gray-400);
        }

        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.75rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            padding: 1rem;
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            font-weight: 600;
        }

        .checkbox-label input {
            width: 1.25rem;
            height: 1.25rem;
        }

        .radio-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: var(--gray-100);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .radio-label:hover {
            background: var(--gray-200);
        }

        .radio-label input:checked + span {
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
        }

        .btn-submit {
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #e85a2a;
            transform: translateY(-2px);
        }

        .btn-reset {
            padding: 1rem 2rem;
            background: var(--gray-200);
            color: var(--gray-700);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: var(--gray-300);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--success-color);
            color: white;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: var(--danger-color);
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title">+ Nuovo Viaggio</h1>
            <a href="welcome.html" class="back-btn">< Torna alla Home</a>
        </div>

        <div class="form-card">
            <form id="viaggioForm" onsubmit="saveViaggio(event)">
                <div class="form-grid">
                    <!-- Campo URGENTE -->
                    <div class="form-group full-width">
                        <label class="checkbox-label">
                            <input type="checkbox" id="urgente">
                            <span>! URGENTE</span>
                        </label>
                    </div>

                    <!-- Campo AZIENDA -->
                    <div class="form-group">
                        <label for="azienda">Azienda/Cliente *</label>
                        <input type="text" id="azienda" required placeholder="es. CLIENTE BETA" list="aziendaList">
                        <datalist id="aziendaList"></datalist>
                    </div>

                    <!-- Campo LUOGO -->
                    <div class="form-group">
                        <label for="luogo">Luogo Destinazione *</label>
                        <input type="text" id="luogo" required placeholder="es. Milano, Via Roma 123">
                        <datalist id="luogoList"></datalist>
                    </div>

                    <!-- Campo DATA -->
                    <div class="form-group">
                        <label for="data">Data Richiesta *</label>
                        <input type="date" id="data" required>
                    </div>

                    <!-- Campo ORARIO -->
                    <div class="form-group">
                        <label for="orario">Orario Arrivo Richiesto *</label>
                        <input type="time" id="orario" required>
                    </div>

                    <!-- Campo CIRCUITO -->
                    <div class="form-group">
                        <label for="circuito">Circuito Geografico *</label>
                        <select id="circuito" required>
                            <option value="">Seleziona circuito</option>
                            <option value="nord-est">Nord-Est</option>
                            <option value="nord-ovest">Nord-Ovest</option>
                            <option value="sud">Sud</option>
                            <option value="corriere">Corriere Esterno</option>
                        </select>
                    </div>

                    <!-- Campo MERCE -->
                    <div class="form-group full-width">
                        <label for="merce">Descrizione Merce *</label>
                        <textarea id="merce" required placeholder="es. Capi abbigliamento lusso" rows="2"></textarea>
                    </div>

                    <!-- Campo PESO -->
                    <div class="form-group">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" placeholder="es. 15" min="0" step="0.1">
                    </div>

                    <!-- Campo VOLUME -->
                    <div class="form-group">
                        <label for="volume">Numero Pacchi</label>
                        <input type="number" id="volume" placeholder="es. 3" min="0" step="1">
                    </div>

                    <!-- Campo MOTIVO -->
                    <div class="form-group full-width">
                        <label>Motivo Viaggio *</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="motivo" value="ritiro" required>
                                <span>Ritiro</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="motivo" value="consegna" required>
                                <span>Consegna</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="motivo" value="entrambi" required>
                                <span>Ritiro + Consegna</span>
                            </label>
                        </div>
                    </div>

                    <!-- Note -->
                    <div class="form-group full-width">
                        <label for="note">Note Aggiuntive (opzionale)</label>
                        <textarea id="note" placeholder="Eventuali note aggiuntive..." rows="2"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-reset">Pulisci Form</button>
                    <button type="submit" class="btn-submit">Invia Richiesta</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        // Set today's date as default
        document.getElementById('data').valueAsDate = new Date();

        async function saveViaggio(event) {
            event.preventDefault();

            const viaggioData = {
                urgente: document.getElementById('urgente').checked,
                azienda: document.getElementById('azienda').value.trim(),
                luogo: document.getElementById('luogo').value.trim(),
                data: document.getElementById('data').value,
                orario: document.getElementById('orario').value,
                circuito: document.getElementById('circuito').value,
                merce: document.getElementById('merce').value.trim(),
                peso: parseFloat(document.getElementById('peso').value) || 0,
                volume: parseInt(document.getElementById('volume').value) || 0,
                motivo: document.querySelector('input[name="motivo"]:checked').value,
                note: document.getElementById('note').value.trim(),
                column: 'richieste',
                order: Date.now(),
                created_by_username: 'Utente',
                status: 'pending'
            };

            try {
                const { data, error } = await supabase
                    .from('viaggi')
                    .insert([viaggioData])
                    .select();

                if (error) throw error;

                showToast('Viaggio creato con successo!', 'success');
                document.getElementById('viaggioForm').reset();
                document.getElementById('data').valueAsDate = new Date();

                // Redirect to kanban after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('Errore:', error);
                showToast('Errore nel salvataggio: ' + error.message, 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.saveViaggio = saveViaggio;
    </script>
</body>
</html>
