<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RBS Logistica Smart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff6b35;
            --gray-100: #f7fafc;
            --gray-300: #cbd5e0;
            --gray-600: #718096;
            --gray-700: #4a5568;
            --gray-900: #1a202c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            margin: 1rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--gray-600);
            font-size: 0.875rem;
        }

        .login-form {
            margin-top: 2rem;
        }

        .login-form-group {
            margin-bottom: 1.5rem;
        }

        .login-form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        .login-form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .login-form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .login-btn:hover:not(:disabled) {
            background: #e85a2a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-error {
            background: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        .login-success {
            background: #efe;
            color: #363;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        .login-success.show {
            display: block;
        }

        .config-warning {
            background: #fff3cd;
            color: #856404;
            padding: 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            border: 1px solid #ffc107;
        }

        .config-warning strong {
            display: block;
            margin-bottom: 0.5rem;
        }

        .config-warning code {
            background: #fff;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">🚚 RBS Logistica Smart</h1>
            <p class="login-subtitle">Sistema di Gestione Viaggi</p>
        </div>

        <div class="config-warning" id="configWarning">
            <strong>⚠️ CONFIGURAZIONE RICHIESTA</strong>
            Devi configurare le credenziali Supabase nel codice JavaScript qui sotto.
            Cerca <code>YOUR_SUPABASE_URL</code> e sostituiscilo con i tuoi dati.
        </div>

        <div class="login-error" id="loginError"></div>
        <div class="login-success" id="loginSuccess"></div>

        <form class="login-form" id="loginForm">
            <div class="login-form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus placeholder="es. admin@rbslogistica.local">
            </div>

            <div class="login-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Inserisci password">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">🔐 Accedi</button>
        </form>
    </div>

    <!-- Load Supabase from CDN (UMD version for Playcode compatibility) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ==========================================
        // CONFIGURAZIONE SUPABASE
        // ⚠️ MODIFICA QUESTI VALORI CON I TUOI!
        // ==========================================
        const SUPABASE_CONFIG = {
            // SOSTITUISCI con il tuo Project URL da: https://app.supabase.com > Settings > API
            url: 'YOUR_SUPABASE_URL',

            // SOSTITUISCI con la tua anon key da: https://app.supabase.com > Settings > API
            anonKey: 'YOUR_SUPABASE_ANON_KEY'
        };

        // ==========================================
        // INIZIALIZZAZIONE
        // ==========================================

        // Create Supabase client (usando la versione UMD caricata dal CDN)
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        console.log('🚀 Supabase client inizializzato');
        console.log('📍 URL:', SUPABASE_CONFIG.url);

        // Check if configuration is needed
        if (SUPABASE_CONFIG.url === 'YOUR_SUPABASE_URL') {
            console.error('⚠️ CONFIGURAZIONE RICHIESTA: Modifica SUPABASE_CONFIG nel codice');
            document.getElementById('configWarning').style.display = 'block';
        } else {
            document.getElementById('configWarning').style.display = 'none';
        }

        // ==========================================
        // LOGIN LOGIC
        // ==========================================

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            await handleLogin();
        });

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');

            // Check configuration
            if (SUPABASE_CONFIG.url === 'YOUR_SUPABASE_URL') {
                showError('⚠️ Configurazione Supabase mancante! Modifica SUPABASE_CONFIG nel codice JavaScript.');
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Accesso in corso...';
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            try {
                console.log('🔐 Tentativo login per:', email);

                // Sign in with Supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    throw new Error('Sessione non valida');
                }

                console.log('✅ Login riuscito per:', data.user.email);

                // Get user profile to verify role
                const { data: profile, error: profileError } = await supabaseClient
                    .from('user_profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (profileError) {
                    console.error('❌ Errore profilo:', profileError);
                    throw new Error(`Profilo utente non trovato. Dettagli: ${profileError.message}`);
                }

                if (!profile) {
                    throw new Error('Profilo utente non trovato. Contatta l\'amministratore.');
                }

                console.log('✅ Profilo caricato:', profile.username);

                // Success!
                successDiv.textContent = `✅ Accesso riuscito! Benvenuto ${profile.username}`;
                successDiv.classList.add('show');

                // Store session in localStorage for main page
                localStorage.setItem('rbs_session', JSON.stringify({
                    userId: profile.id,
                    username: profile.user_id,
                    role: profile.role,
                    name: profile.username
                }));

                // Redirect to app
                setTimeout(() => {
                    // Su Playcode, apri in una nuova tab o modifica questo URL
                    window.location.href = 'index-playcode.html';
                }, 1000);

            } catch (error) {
                console.error('❌ Errore login:', error);

                let errorMessage = '❌ Email o password non corretti';

                if (error.message.includes('Invalid login credentials')) {
                    errorMessage = '❌ Email o password non corretti. Verifica le credenziali.';
                } else if (error.message.includes('Email not confirmed')) {
                    errorMessage = '⚠️ Email non confermata. Contatta l\'amministratore.';
                } else if (error.message.includes('Profilo utente non trovato')) {
                    errorMessage = '⚠️ ' + error.message;
                } else if (error.message.includes('fetch') || error.message.includes('network')) {
                    errorMessage = '🌐 Errore di connessione. Verifica la configurazione Supabase.';
                } else {
                    errorMessage = `❌ Errore: ${error.message}`;
                }

                showError(errorMessage);

                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.textContent = '🔐 Accedi';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 8000);
        }

        // Check for existing session on load
        async function checkExistingSession() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();

                if (session) {
                    console.log('✅ Sessione esistente trovata, redirect...');
                    window.location.href = 'index-playcode.html';
                }
            } catch (error) {
                console.log('Nessuna sessione esistente');
            }
        }

        // Check on load
        checkExistingSession();
    </script>
</body>
</html>
