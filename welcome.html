<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBS Logistica Smart</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .welcome-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            margin: 1rem;
            text-align: center;
        }

        .welcome-logo {
            max-height: 80px;
            margin-bottom: 1.5rem;
        }

        .welcome-title {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .welcome-subtitle {
            color: var(--gray-600);
            font-size: 1rem;
            margin-bottom: 2.5rem;
        }

        .welcome-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .welcome-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .welcome-btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, #e85a2a 100%);
            color: white;
        }

        .welcome-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .welcome-btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #003d6b 100%);
            color: white;
        }

        .welcome-btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 78, 137, 0.4);
        }

        .welcome-btn-icon {
            font-size: 1.5rem;
        }

        .welcome-footer {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
            color: var(--gray-500);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <img src="logo.svg" alt="RBS 1979" class="welcome-logo" onerror="this.style.display='none'">
        <h1 class="welcome-title">RBS Logistica Smart</h1>
        <p class="welcome-subtitle">Sistema di Gestione Viaggi</p>

        <div class="welcome-actions">
            <a href="nuovo-viaggio.html" class="welcome-btn welcome-btn-primary">
                <span class="welcome-btn-icon">+</span>
                <span>Crea Nuovo Viaggio</span>
            </a>

            <a href="dashboard.html" class="welcome-btn welcome-btn-secondary">
                <span class="welcome-btn-icon">:</span>
                <span>Visualizza Kanban</span>
            </a>

            <a href="anagrafica.html" class="welcome-btn" style="background: linear-gradient(135deg, #06d6a0 0%, #05b384 100%); color: white;">
                <span class="welcome-btn-icon">@</span>
                <span>Gestione Clienti</span>
            </a>
        </div>

        <div class="welcome-footer">
            RBS Logistica Smart - Gestione viaggi semplificata
        </div>
    </div>
</body>
</html>
