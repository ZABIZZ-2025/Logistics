<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RBS Logistica Smart</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            margin: 1rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            max-height: 60px;
            margin-bottom: 1rem;
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--gray-600);
            font-size: 0.875rem;
        }

        .login-form {
            margin-top: 2rem;
        }

        .login-form-group {
            margin-bottom: 1.5rem;
        }

        .login-form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        .login-form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .login-form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .login-btn:hover:not(:disabled) {
            background: #e85a2a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-error {
            background: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        .login-success {
            background: #efe;
            color: #363;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        .login-success.show {
            display: block;
        }

        .login-info {
            margin-top: 2rem;
            padding: 1rem;
            background: var(--gray-100);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--gray-700);
        }

        .login-info strong {
            color: var(--gray-900);
        }

        .user-list {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="logo.svg" alt="RBS 1979" class="login-logo" onerror="this.style.display='none'">
            <h1 class="login-title">RBS Logistica Smart</h1>
            <p class="login-subtitle">Sistema di Gestione Viaggi</p>
        </div>

        <div class="login-error" id="loginError"></div>
        <div class="login-success" id="loginSuccess"></div>

        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="login-form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus placeholder="es. admin@rbslogistica.local">
            </div>

            <div class="login-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Inserisci password">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">🔐 Accedi</button>
        </form>

        <!-- Credenziali rimosse per sicurezza -->
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        // Verifica che il client Supabase sia inizializzato
        if (!supabase) {
            document.getElementById('loginError').textContent = '❌ Errore di configurazione Supabase. Contatta l\'amministratore.';
            document.getElementById('loginError').classList.add('show');
            document.getElementById('loginBtn').disabled = true;
        }

        // Check if already logged in
        async function checkExistingSession() {
            if (!supabase) return;

            try {
                const { data: { session }, error } = await supabase.auth.getSession();

                if (error) {
                    console.error('Errore verifica sessione:', error);
                    return;
                }

                if (session) {
                    // Already logged in, redirect to app
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error('Errore connessione Supabase:', err);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');

            // Verifica client Supabase
            if (!supabase) {
                showError('❌ Errore di configurazione. Ricarica la pagina.');
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Accesso in corso...';
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            try {
                // Sign in with Supabase
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    throw new Error('Sessione non valida');
                }

                // Get user profile to verify role
                const { data: profile, error: profileError } = await supabase
                    .from('user_profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (profileError || !profile) {
                    throw new Error('Profilo utente non trovato. Contatta l\'amministratore.');
                }

                // Success!
                successDiv.textContent = `✅ Accesso riuscito! Benvenuto ${profile.username}`;
                successDiv.classList.add('show');

                // Redirect to app
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);

            } catch (error) {
                console.error('❌ Errore login:', error);

                let errorMessage = '❌ Email o password non corretti';

                if (error.message.includes('Invalid login credentials')) {
                    errorMessage = '❌ Email o password non corretti. Verifica le credenziali.';
                } else if (error.message.includes('Email not confirmed')) {
                    errorMessage = '⚠️ Email non confermata. Contatta l\'amministratore.';
                } else if (error.message.includes('Profilo utente non trovato')) {
                    errorMessage = '⚠️ ' + error.message;
                } else if (error.message.includes('fetch') || error.message.includes('network')) {
                    errorMessage = '🌐 Errore di connessione. Verifica la configurazione Supabase.';
                } else {
                    errorMessage = `❌ Errore: ${error.message}`;
                }

                showError(errorMessage);

                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.textContent = '🔐 Accedi';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        // Make handleLogin globally accessible
        window.handleLogin = handleLogin;

        // Check for existing session on load
        checkExistingSession();
    </script>
</body>
</html>
